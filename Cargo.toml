[package]
name = "utui"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "A blazing-fast terminal YouTube browser built in Rust"
license = "MIT"
repository = "https://github.com/castillo/utui"
keywords = ["youtube", "tui", "yt-dlp", "mpv", "cli"]
categories = ["command-line-utilities", "multimedia::video"]

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.28"
directories = "5"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "sync", "time", "io-util"] }
toml = "0.8"
unicode-width = "0.2"
urlencoding = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
